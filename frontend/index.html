<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0612" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/amy-workspaice-app-icon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/amy-workspaice-app-icon.svg" />
    <link rel="apple-touch-icon" href="/brand/amy-workspaice-app-icon-180.png" />
    <title>Amy-WorkspAIce AI Platform</title>
    <script>
      // Apply the saved theme before first paint (dark by default; "system" follows the OS).
      try {
        var t = localStorage.getItem("amy.theme") || "dark";
        if (t === "system") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
